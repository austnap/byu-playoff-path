<title>Big 12 Title Race</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: stadium-scoreboard header, title-game card, contender board, week-by-week pick list */
/* BYU athletics palette: royal blue #0062B8, navy #002E5D, white */
:root{
  --bg:#eef3f9; --card:#ffffff; --fg:#0b1b2e; --muted:#56657a; --line:#d6e0ec;
  --accent:#0062B8; --chip:#e7eef7; --good:#1f8a4c; --warn:#b26a00;
  --royal:#0062B8; --navy:#002E5D; --onroyal:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06121f; --card:#0d1e33; --fg:#eef4fb; --muted:#93a6bf; --line:#1d3350; --accent:#5aa7ff; --chip:#15294a; --good:#4cc47f; --warn:#e8a33a; --royal:#0062B8; --navy:#002E5D; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06121f; --card:#0d1e33; --fg:#eef4fb; --muted:#93a6bf; --line:#1d3350; --accent:#5aa7ff; --chip:#15294a; --good:#4cc47f; --warn:#e8a33a; --royal:#0062B8; --navy:#002E5D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
h1 span{color:#9cc8f5}
.sub{color:rgba(255,255,255,.86);font-size:13px;margin-top:4px}
/* royal blue header band, edge to edge */
.wrap > header{background:var(--royal);color:var(--onroyal);margin-inline:calc(50% - 50vw);margin-top:-12px;padding:22px max(16px, calc(50vw - 280px)) 18px;border-bottom:4px solid var(--navy)}
.wrap > header .howto{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.wrap > header .howto summary,.wrap > header .howgrid p,.wrap > header .howgrid i{color:#fff}
.seg button[aria-selected="true"]{color:var(--royal)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-selected="true"]{color:#fff!important}}
.fanote{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.label{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
/* title game */
.tg{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tg-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:8px}
.slot{border-radius:10px;padding:10px;min-height:62px;display:flex;flex-direction:column;justify-content:center;color:#fff;background:var(--chip)}
.slot.tbd{color:var(--muted);border:1px dashed var(--line);background:transparent}
.slot .nm{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase}
.slot .rec{font-size:12px;opacity:.9;margin-top:3px}
.vs{font-family:var(--display);font-weight:700;color:var(--muted)}
.tg-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.btns{display:flex;gap:6px}
button{font:inherit;cursor:pointer}
.ghost{background:var(--chip);color:var(--fg);border:0;border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px}
.ghost:focus-visible,.tbtn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* contenders */
.ct{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.crow{display:grid;grid-template-columns:8px minmax(0,1fr) 46px 58px;gap:10px;align-items:center}
.sw{width:8px;height:28px;border-radius:3px}
.cname{font-weight:600;min-width:0}
.cname small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.crec{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
.cpct{font-family:var(--display);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.bar{grid-column:2/5;height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin-top:-3px}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:6px;vertical-align:1px;text-transform:uppercase;letter-spacing:.04em}
.pill.in{background:var(--good);color:#fff}.pill.out{background:var(--chip);color:var(--muted)}
.more{margin-top:10px;width:100%}
/* weeks */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;min-width:70px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 6px;font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase}
.tab small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);text-transform:none}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.games{display:flex;flex-direction:column;gap:8px}
.game{display:grid;grid-template-columns:1fr 26px 1fr;gap:6px;align-items:stretch}
.at{align-self:center;text-align:center;color:var(--muted);font-size:12px;font-weight:600}
.tbtn{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 8px;min-height:52px;text-align:left;display:flex;flex-direction:column;justify-content:center;transition:background .12s,opacity .12s}
.tbtn .tn{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05;text-transform:uppercase}
.tbtn .tr{font-size:11.5px;color:var(--muted)}
.tbtn.win{color:#fff;border-color:transparent}
.tbtn.win .tr{color:#fff;opacity:.85}
.tbtn.lose{opacity:.45}
.game.hot .tbtn:not(.win){border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wkbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.legend{font-size:12px;color:var(--muted)}
.legend b{color:var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;margin-left:4px;background:var(--chip);color:var(--muted);vertical-align:1px}
.tbtn.win .tag{background:rgba(255,255,255,.22);color:#fff}
.gwrap{display:flex;flex-direction:column;gap:4px}
.gmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:0 2px}
.gmeta .sw-l{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gmeta .up{color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.game.swing .tbtn{border-color:var(--accent)}
.tab .dot{color:var(--accent)}
.sc{float:right;font-family:var(--display);font-weight:800;font-size:20px;margin-left:6px}
.tbtn.final{cursor:default}
.gmeta .fin{font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gmeta .live,.tab .livedot{color:#e5383b;font-weight:700}
.livebar{font-size:12.5px;color:var(--muted)}
.howto{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.howto summary{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;cursor:pointer}
.howgrid{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.howgrid b{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.howgrid p{margin:5px 0 0;font-size:13.5px;line-height:1.45;color:var(--fg)}
.howgrid i{color:var(--muted);font-style:normal;font-weight:600}
/* standings */
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td{padding:6px 4px;border-top:1px solid var(--line)}
td.r{text-align:right;color:var(--muted)}
tr.top td{font-weight:700}
.why{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.why b{color:var(--fg);font-weight:600}
.note{font-size:12px;color:var(--muted);line-height:1.45}
details summary{cursor:pointer;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
@media (prefers-reduced-motion:reduce){.tbtn{transition:none}}
</style>
